<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="UGC planner">
  <!-- Full bleed, and the whole mark inside the central safe zone (a circle
       of radius 204), so no platform mask - circle, squircle, teardrop - can
       clip it. The same drawing as icon.svg, scaled to 0.8 about the centre. -->
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#05070b"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <circle cx="256" cy="256" r="176" fill="none" stroke="#222b38" stroke-width="3"/>
    <g stroke="#6f7c90" stroke-width="7" stroke-linecap="round">
      <line x1="256" y1="256" x2="146" y2="186"/>
      <line x1="256" y1="256" x2="378" y2="204"/>
      <line x1="256" y1="256" x2="232" y2="382"/>
    </g>
    <g stroke="#33404f" stroke-width="4" stroke-linecap="round">
      <line x1="146" y1="186" x2="118" y2="258"/>
      <line x1="378" y1="204" x2="402" y2="150"/>
      <line x1="232" y1="382" x2="296" y2="398"/>
    </g>
    <circle cx="118" cy="258" r="10" fill="#8c9aaf"/>
    <circle cx="402" cy="150" r="10" fill="#8c9aaf"/>
    <circle cx="296" cy="398" r="10" fill="#8c9aaf"/>
    <circle cx="146" cy="186" r="21" fill="#a4b1c3"/>
    <circle cx="378" cy="204" r="21" fill="#a4b1c3"/>
    <circle cx="232" cy="382" r="21" fill="#a4b1c3"/>
    <circle cx="256" cy="256" r="96" fill="url(#core-glow)"/>
    <circle cx="256" cy="256" r="36" fill="#ffffff"/>
  </g>
</svg>
